<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Art Mood | مدیریت</title>
<style>
body{margin:0;background:#f6f4ef;color:#222;font-family:Tahoma,Arial}.wrap{max-width:1150px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.logo{font-size:23px;font-weight:800}.logo span{color:#a47755}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.box{background:#fff;border:1px solid #e5e0d7;border-radius:16px;padding:18px}.stat b{font-size:25px;display:block;margin-top:8px}section{margin-top:25px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}th,td{padding:13px;border-bottom:1px solid #eee;text-align:right;font-size:13px}button{border:0;border-radius:9px;padding:9px 13px;background:#222;color:#fff;cursor:pointer}button.alt{background:#e9e5dc;color:#222}input{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 10px}form{max-width:500px}.hidden{display:none}.login{max-width:380px;margin:12vh auto}.danger{color:#a33}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}table{font-size:11px}th,td{padding:8px}}@media(max-width:450px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div id="login" class="box login"><h2>ورود به پنل Art Mood</h2><form id="loginForm"><input id="password" type="password" placeholder="رمز مدیر" required><button>ورود</button></form><p id="loginErr" class="danger"></p></div>
<div id="app" class="hidden"><header><div class="logo">Art <span>Mood</span> / مدیریت</div><button class="alt" onclick="logout()">خروج</button></header>
<div class="grid"><div class="stat">کل سفارش‌ها<b id="orders">۰</b></div><div class="stat">پرداخت‌شده<b id="paid">۰</b></div><div class="stat">فروش<b id="revenue">۰</b> تومان</div><div class="stat">موجودی کم<b id="low">۰</b></div></div>
<section class="box"><h2>محصولات</h2><form id="productForm"><input id="pid" placeholder="شناسه، مثلا new-art"><input id="pname" placeholder="نام محصول"><input id="price" type="number" placeholder="قیمت"><input id="stock" type="number" placeholder="موجودی"><input id="desc" placeholder="توضیح"><button>افزودن / ذخیره محصول</button></form><div id="products"></div></section>
<section class="box"><h2>سفارش‌ها</h2><div style="overflow:auto"><table><thead><tr><th>شماره</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section>
</div></div>
<script>
let token=localStorage.getItem("artmood-admin-token");
const fa=n=>new Intl.NumberFormat("fa-IR").format(n);
function show(){document.getElementById("login").classList.toggle("hidden",!!token);document.getElementById("app").classList.toggle("hidden",!token);if(token)load()}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};const r=await fetch(url,opt);const d=await r.json();if(r.status===401){token=null;localStorage.removeItem("artmood-admin-token");show()}if(!r.ok)throw new Error(d.error||"خطا");return d}
document.getElementById("loginForm").onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)return document.getElementById("loginErr").textContent=d.error;token=d.token;localStorage.setItem("artmood-admin-token",token);show()}
async function load(){const d=await api("/api/admin/dashboard");document.getElementById("orders").textContent=fa(d.stats.totalOrders);document.getElementById("paid").textContent=fa(d.stats.paidOrders);document.getElementById("revenue").textContent=fa(d.stats.revenue);document.getElementById("low").textContent=fa(d.stats.lowStock);
document.getElementById("products").innerHTML=d.products.map(p=>`<p><b>${p.name}</b> — ${fa(p.price)} تومان — موجودی: ${fa(p.stock)} <button class="alt" onclick="stock('${p.id}',${p.stock})">تغییر موجودی</button> ${p.active?'':'(غیرفعال)'}</p>`).join("");
document.getElementById("ordersTable").innerHTML=d.orders.map(o=>`<tr><td>${o.id}</td><td>${o.customer.name}<br>${o.customer.phone}</td><td>${fa(o.total)}</td><td>${o.status}</td><td>${new Date(o.createdAt).toLocaleDateString("fa-IR")}</td><td><button onclick="paid('${o.id}')">تحویل/تکمیل</button></td></tr>`).join("")||"<tr><td colspan=6>هنوز سفارشی ثبت نشده.</td></tr>"}
document.getElementById("productForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/products",{method:"POST",body:JSON.stringify({id:pid.value.trim(),name:pname.value.trim(),price:+price.value,stock:+stock.value,desc:desc.value,active:true,cls:"p1"})});e.target.reset();load()}catch(x){alert(x.message)}}
async function stock(id,current){const v=prompt("موجودی جدید:",current);if(v===null)return;await api("/api/admin/products/"+id,{method:"PATCH",body:JSON.stringify({stock:+v})});load()}
async function paid(id){await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status:"completed"})});load()}
async function logout(){if(token)await api("/api/admin/logout",{method:"POST"});token=null;localStorage.removeItem("artmood-admin-token");show()}
show();
</script></body></html>
